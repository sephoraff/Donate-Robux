<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donate Robux 💸</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6f6, #d9e7ff);
    text-align: center;
  }
  .box {
    background: white;
    padding: 35px;
    border-radius: 25px;
    width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
  }
  h1 { font-size: 30px; }
  p { color: #666; }
  button {
    border: 0;
    padding: 14px 25px;
    border-radius: 15px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    background: #ff69b4;
    color: white;
  }
  button:hover { transform: scale(1.05); }
  #joke { display: none; margin-top: 20px; font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<div class="box">
  <h1>💸 Donate Robux 💸</h1>
  <p>Help me reach my extremely important goal:</p>
  <h2>0 / 1,000,000 Robux</h2>
  <button onclick="donate()">DONATE NOW 😭</button>
  <div id="joke">💀 BRO YOU ACTUALLY CLICKED<br><br>I GOT NOTHING 😭😭</div>
</div>
<script>
function donate() {
  document.getElementById("joke").style.display = "block";
}
</script>
</body>
</html>
